<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>走完一条小路 · A Little Path</title>
<style>
  :root{
    --cream:#f7f1e6; --cream2:#efe6d4; --ink:#4a3f35; --ink-soft:#8a7d6e;
    --gold:#d9b877; --gold-deep:#c9a45e; --card:rgba(255,255,255,.72);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Nunito","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink); background:linear-gradient(160deg,var(--cream),var(--cream2));
    overflow:hidden; -webkit-tap-highlight-color:transparent;
  }
  .title{font-family:"Great Vibes","Segoe Script","Brush Script MT",cursive}
  .screen{
    position:fixed; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:22px; padding:32px 22px;
    text-align:center;
  }
  .screen.active{display:flex; animation:fade .6s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .floaters{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0}
  .floaters span{
    position:absolute; bottom:-20px; width:7px; height:7px; border-radius:50%;
    background:radial-gradient(circle,var(--gold),transparent 70%); opacity:.5;
    animation:rise linear infinite;
  }
  @keyframes rise{
    to{ transform:translateY(-105vh) translateX(20px); opacity:0 }
  }

  .eyebrow{letter-spacing:.32em; font-size:12px; color:var(--ink-soft); text-transform:uppercase}
  h1.title{font-size:clamp(38px,9vw,68px); font-weight:400; line-height:1.1; color:var(--ink)}
  .sub{font-size:15px; color:var(--ink-soft); max-width:430px; line-height:1.9}
  .lead{font-size:16px; max-width:430px; line-height:2}

  .btn{
    border:none; cursor:pointer; font:inherit; font-size:16px; font-weight:700;
    color:#5a4a36; background:linear-gradient(180deg,#fbeecb,var(--gold));
    padding:14px 34px; border-radius:999px; letter-spacing:.05em;
    box-shadow:0 10px 24px rgba(201,164,94,.4); transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-2px); box-shadow:0 14px 30px rgba(201,164,94,.5)}
  .btn:active{transform:translateY(0)}
  .btn.ghost{background:transparent; color:var(--ink-soft); box-shadow:none; font-weight:600; padding:10px 20px}
  .btn[disabled]{opacity:.45; cursor:default; transform:none; box-shadow:none}

  /* walk screen */
  #walk{gap:14px}
  #progress{font-size:13px; letter-spacing:.18em; color:var(--ink-soft); margin-bottom:2px}
  .stage{
    position:relative; width:min(360px,82vw); height:54vh; min-height:330px;
    border-radius:24px; overflow:hidden;
    background:linear-gradient(180deg,#f3ecdb 0%,#e9dfc7 62%,#d9cba9 100%);
    box-shadow:inset 0 2px 14px rgba(120,100,70,.18);
  }
  .road{
    position:absolute; left:50%; bottom:0; width:64%; height:100%;
    transform:translateX(-50%);
    background:linear-gradient(180deg,rgba(214,198,162,0) 0%,rgba(201,178,132,.95) 96%);
    clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);
  }
  .road::after{
    content:""; position:absolute; inset:0;
    background-image:repeating-linear-gradient(180deg,transparent 0 26px,rgba(150,120,80,.22) 26px 30px);
    clip-path:inherit; animation:scroll 1.4s linear infinite;
  }
  @keyframes scroll{to{background-position:0 30px}}
  .player{
    position:absolute; left:50%; bottom:14%;
    width:18px; height:18px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,var(--gold) 60%,var(--gold-deep));
    box-shadow:0 0 18px 6px rgba(217,184,119,.7);
    transform:translate(-50%,-50%); transition:bottom .6s cubic-bezier(.4,0,.2,1), left .6s ease, transform .6s ease;
  }
  .note{
    position:absolute; top:14px; left:0; right:0; text-align:center;
    font-size:14px; color:var(--ink-soft); opacity:0; transition:opacity .5s ease;
  }
  .note.show{opacity:1}

  .pick{
    position:absolute; max-width:200px; padding:12px 16px; border-radius:16px;
    background:var(--card); color:var(--ink); font-size:15px; line-height:1.6;
    box-shadow:0 8px 22px rgba(120,100,70,.25); opacity:0; transform:translateY(10px) scale(.96);
    transition:opacity .45s ease, transform .45s ease; pointer-events:none; z-index:3;
  }
  .pick.left{left:8px; text-align:left}
  .pick.right{right:8px; text-align:left}
  .pick.show{opacity:1; transform:none}
  .pick .grab{margin-top:9px; font-size:12px; font-weight:700; color:var(--gold-deep); letter-spacing:.05em}
  .pick.done{opacity:.35; filter:grayscale(.4)}

  .collected{
    display:flex; flex-wrap:wrap; gap:7px; justify-content:center; max-width:360px; min-height:30px;
  }
  .chip{
    font-size:12px; padding:5px 12px; border-radius:999px; background:var(--card);
    color:var(--ink-soft); box-shadow:0 4px 10px rgba(120,100,70,.15);
    animation:pop .4s ease both;
  }
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

  /* end screen */
  #end .result{
    max-width:440px; font-size:18px; line-height:2.1; color:var(--ink);
  }
  #end .result span{display:block; opacity:0; transform:translateY(10px); animation:riseIn .7s ease forwards}
  @keyframes riseIn{to{opacity:1; transform:none}}
  .sign{font-size:13px; color:var(--ink-soft); letter-spacing:.12em; margin-top:4px}
  .row{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:6px}
</style>
</head>
<body>
  <div class="floaters" id="floaters"></div>

  <!-- 1. start -->
  <section class="screen active" id="start">
    <div class="eyebrow">A Little Path</div>
    <h1 class="title">走完一条小路</h1>
    <p class="lead">一条很普通的小路。<br/>慢慢走，路边的句子，记得捡起来。</p>
    <button class="btn" id="startBtn">开始走 · Start</button>
  </section>

  <!-- 2. walk -->
  <section class="screen" id="walk">
    <div id="progress">第 1 步</div>
    <div class="stage" id="stage">
      <div class="road"></div>
      <div class="player" id="player"></div>
      <div class="note" id="note"></div>
      <div class="pick left" id="pick"><span id="pickText"></span><div class="grab" id="grab">捡起这句话 →</div></div>
    </div>
    <div class="collected" id="collected"></div>
    <button class="btn" id="walkBtn">向前走一步</button>
  </section>

  <!-- 3. end -->
  <section class="screen" id="end">
    <div class="eyebrow">The end of the path</div>
    <h1 class="title" style="font-size:clamp(30px,7vw,46px)">你走到了小路的尽头</h1>
    <p class="sub">你一路捡到的句子，拼成了这一句：</p>
    <div class="result" id="result"></div>
    <div class="sign">—— 这是属于你的小路</div>
    <div class="row">
      <button class="btn ghost" id="againBtn">再走一次</button>
      <a class="btn" href="/?world=1">回到杰尼亚的世界</a>
    </div>
  </section>

<script>
(function(){
  "use strict";
  var STEPS = [
    {t:"walk", note:"风很轻。"},
    {t:"pick", text:"你比想象中更稳。"},
    {t:"walk", note:"路边的草晃了晃。"},
    {t:"pick", text:"有些路只能一个人走。"},
    {t:"walk", note:""},
    {t:"pick", text:"但回头看，已经走了很远。"},
    {t:"walk", note:"远处有一盏灯。"},
    {t:"walk", note:""},
    {t:"pick", text:"慢一点，也没关系。"},
    {t:"walk", note:"脚下的石子有点凉。"},
    {t:"pick", text:"你种下的，后来都开了。"},
    {t:"walk", note:""},
    {t:"pick", text:"这一路，你一直在陪自己走。"},
    {t:"end",  note:"小路到了尽头。"}
  ];
  var TOTAL = STEPS.length;
  var i = 0, collected = [], picked = false;

  var $ = function(s){ return document.querySelector(s); };
  var screens = { start:$("#start"), walk:$("#walk"), end:$("#end") };
  var player = $("#player"), note = $("#note"), pick = $("#pick"),
      pickText = $("#pickText"), grab = $("#grab"),
      progress = $("#progress"), collectedEl = $("#collected"),
      walkBtn = $("#walkBtn"), result = $("#result");

  function show(name){
    for (var k in screens) screens[k].classList.remove("active");
    screens[name].classList.add("active");
  }
  function setNote(t){
    if (t){ note.textContent = t; note.classList.add("show"); }
    else { note.classList.remove("show"); }
  }
  function placePlayer(){
    var p = i/(TOTAL-1);
    player.style.bottom = (14 + p*70) + "%";
    player.style.left = (50 - 8 + p*16) + "%";
    player.style.transform = "translate(-50%,-50%) scale(" + (1 - 0.4*p) + ")";
  }
  function hidePick(){
    pick.classList.remove("show","done","left","right");
  }
  function render(){
    var step = STEPS[i];
    progress.textContent = (step.t==="end") ? "到了" : ("第 " + (i+1) + " / " + TOTAL + " 步");
    placePlayer();
    if (step.t==="pick"){
      setNote("");
      pickText.textContent = step.text;
      pick.classList.add(i%2 ? "right" : "left");
      if (picked){ pick.classList.add("done"); }
      else { pick.classList.remove("done"); }
      pick.classList.add("show");
      walkBtn.disabled = !picked;
      walkBtn.textContent = picked ? "向前走一步" : "先捡起这句话";
    } else if (step.t==="walk"){
      hidePick();
      setNote(step.note);
      walkBtn.disabled = false;
      walkBtn.textContent = "向前走一步";
    } else if (step.t==="end"){
      finish();
    }
  }
  function grabIt(){
    if (picked) return;
    var step = STEPS[i];
    if (step.t!=="pick") return;
    picked = true;
    collected.push(step.text);
    var chip = document.createElement("div");
    chip.className = "chip";
    chip.textContent = step.text;
    collectedEl.appendChild(chip);
    pick.classList.add("done");
    walkBtn.disabled = false;
    walkBtn.textContent = "向前走一步";
  }
  function advance(){
    var step = STEPS[i];
    if (step.t==="pick" && !picked){
      walkBtn.classList.add("shake");
      setTimeout(function(){ walkBtn.classList.remove("shake"); }, 420);
      return;
    }
    if (i >= TOTAL-1){ finish(); return; }
    i++;
    picked = false;
    render();
  }
  function finish(){
    show("end");
    result.innerHTML = "";
    var lines = collected.length ? collected : STEPS.filter(function(s){return s.t==="pick";}).map(function(s){return s.text;});
    lines.forEach(function(t, idx){
      var s = document.createElement("span");
      s.textContent = t;
      s.style.animationDelay = (idx*0.5 + 0.2) + "s";
      result.appendChild(s);
    });
    if (!lines.length){
      var s = document.createElement("span");
      s.textContent = "你一直安静地走着，也很好。";
      s.style.animationDelay = "0.2s";
      result.appendChild(s);
    }
  }
  function reset(){
    i = 0; collected = []; picked = false;
    collectedEl.innerHTML = "";
    hidePick();
    show("walk");
    render();
  }

  // floaters
  var fr = $("#floaters");
  for (var f=0; f<14; f++){
    var d = document.createElement("span");
    d.style.left = Math.random()*100 + "%";
    d.style.animationDuration = (7 + Math.random()*8) + "s";
    d.style.animationDelay = (-Math.random()*10) + "s";
    d.style.width = d.style.height = (4 + Math.random()*6) + "px";
    fr.appendChild(d);
  }

  $("#startBtn").addEventListener("click", function(){ show("walk"); render(); });
  walkBtn.addEventListener("click", advance);
  pick.addEventListener("click", grabIt);
  $("#againBtn").addEventListener("click", reset);
  // allow clicking the stage to walk, clicking a pick to grab
  $("#stage").addEventListener("click", function(e){
    if (e.target === pick || pick.contains(e.target)) return;
    advance();
  });
})();
</script>
</body>
</html>
